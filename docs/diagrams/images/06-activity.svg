<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1620" viewBox="0 0 1400 1620">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#526b73"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#18323a" flood-opacity="0.12"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#f6faf9"/>
<text x="700" y="48" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#172b3a">
<tspan x="700" dy="0">Activity Diagram - Receipt Analysis Flow</tspan>
</text>
<ellipse cx="700" cy="110" rx="105" ry="40" fill="#eef8f5" stroke="#17806d" stroke-width="2"/>
<text x="700" y="115.76" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#172b3a">
<tspan x="700" dy="0">Start</tspan>
</text>
<polygon points="700,165 825,220 700,275 575,220" fill="#fff8e5" stroke="#b7791f" stroke-width="2"/>
<text x="700" y="214.76" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#172b3a">
<tspan x="700" dy="0">Logged in or guest</tspan>
<tspan x="700" dy="22">mode?</tspan>
</text>
<rect x="220" y="305" width="250" height="80" rx="16" fill="#eaf3ff" stroke="#1d4f91" stroke-width="2"/>
<text x="345" y="337.9" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#172b3a">
<tspan x="345" dy="0">Login / Register /</tspan>
<tspan x="345" dy="27">Continue as Guest</tspan>
</text>
<rect x="560" y="430" width="280" height="90" rx="16" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="700" y="467.9" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#172b3a">
<tspan x="700" dy="0">Enter family size, age</tspan>
<tspan x="700" dy="27">group, conditions, notes</tspan>
</text>
<rect x="560" y="570" width="280" height="80" rx="16" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="700" y="602.9" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#172b3a">
<tspan x="700" dy="0">Upload receipt image or</tspan>
<tspan x="700" dy="27">text file</tspan>
</text>
<polygon points="700,683 820,735 700,787 580,735" fill="#fff8e5" stroke="#b7791f" stroke-width="2"/>
<text x="700" y="740.76" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#172b3a">
<tspan x="700" dy="0">Allowed file type?</tspan>
</text>
<rect x="560" y="865" width="280" height="80" rx="16" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="700" y="911.4" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#172b3a">
<tspan x="700" dy="0">Save uploaded receipt</tspan>
</text>
<rect x="560" y="1000" width="280" height="80" rx="16" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="700" y="1032.9" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#172b3a">
<tspan x="700" dy="0">Run Python OCR and</tspan>
<tspan x="700" dy="27">analysis</tspan>
</text>
<polygon points="700,1113 820,1165 700,1217 580,1165" fill="#fff8e5" stroke="#b7791f" stroke-width="2"/>
<text x="700" y="1159.76" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#172b3a">
<tspan x="700" dy="0">Review detected</tspan>
<tspan x="700" dy="22">items?</tspan>
</text>
<rect x="190" y="1260" width="260" height="80" rx="16" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="320" y="1306.4" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#172b3a">
<tspan x="320" dy="0">Save OCR draft</tspan>
</text>
<rect x="190" y="1390" width="260" height="80" rx="16" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="320" y="1436.4" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#172b3a">
<tspan x="320" dy="0">User corrects items</tspan>
</text>
<rect x="560" y="1390" width="280" height="80" rx="16" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="700" y="1436.4" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#172b3a">
<tspan x="700" dy="0">Analyze corrected items</tspan>
</text>
<rect x="930" y="1260" width="280" height="80" rx="16" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="1070" y="1292.9" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#172b3a">
<tspan x="1070" dy="0">Persist result to JSON</tspan>
<tspan x="1070" dy="27">and database</tspan>
</text>
<rect x="930" y="1390" width="280" height="80" rx="16" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="1070" y="1422.9" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#172b3a">
<tspan x="1070" dy="0">Display dashboard and</tspan>
<tspan x="1070" dy="27">recommendations</tspan>
</text>
<ellipse cx="1070" cy="1540" rx="105" ry="40" fill="#eef8f5" stroke="#17806d" stroke-width="2"/>
<text x="1070" y="1545.76" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#172b3a">
<tspan x="1070" dy="0">End</tspan>
</text>
<line x1="700" y1="150" x2="700" y2="165" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="575" y1="220" x2="345" y2="305" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="460" y="254" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#526b73">
<tspan x="460" dy="0">No</tspan>
</text>
<line x1="470" y1="345" x2="700" y2="430" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="700" y1="275" x2="700" y2="430" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="700" y="344" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#526b73">
<tspan x="700" dy="0">Yes</tspan>
</text>
<line x1="700" y1="520" x2="700" y2="570" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="700" y1="650" x2="700" y2="685" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="580" y1="735" x2="700" y2="570" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="640" y="644" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#526b73">
<tspan x="640" dy="0">No</tspan>
</text>
<line x1="700" y1="790" x2="700" y2="865" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="700" y="819" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#526b73">
<tspan x="700" dy="0">Yes</tspan>
</text>
<line x1="700" y1="945" x2="700" y2="1000" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="700" y1="1080" x2="700" y2="1112" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="580" y1="1165" x2="320" y2="1260" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="450" y="1204" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#526b73">
<tspan x="450" dy="0">Yes</tspan>
</text>
<line x1="320" y1="1340" x2="320" y2="1390" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="450" y1="1430" x2="560" y2="1430" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="840" y1="1430" x2="930" y2="1300" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="820" y1="1165" x2="930" y2="1300" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="875" y="1224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#526b73">
<tspan x="875" dy="0">No</tspan>
</text>
<line x1="1070" y1="1340" x2="1070" y2="1390" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="1070" y1="1470" x2="1070" y2="1500" stroke="#526b73" stroke-width="2.4" marker-end="url(#arrow)"/>
</svg>
